name: browser

# The browser tests behind the e2e build tag. `go test ./...` in ci.yml does not
# compile files under a build tag, so without this workflow the tests of the
# view runtime and the development reload that need a real browser would run on
# nobody's machine but a developer's. CI is set, so a missing Chrome fails the
# job instead of skipping it.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Chrome
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome" || { echo "no Chrome on the runner"; exit 1; }
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: vet with the e2e tag
        run: go vet -tags e2e ./internal/testkit/... ./view ./foundation

      - name: browser tests
        run: go test -race -count=1 -tags e2e ./view ./foundation
