name: resp-connectors

# A workflow of its own, for the same reason database-connectors.yml is one:
# hesape/redis and hesape/queue/connectors/redis are separate Go modules, so
# `go build ./...` at the root never reaches them -- and their suite needs a
# RESP server running beside the job, which is a service block ci.yml has no use
# for.
#
# Without this file neither module was compiled by anything. ADR 0048 folded
# arandu-io/kv and arandu-io/queue in and said the suite that came with them
# runs in the CI of hesape; the two doc comments that say "CI sets it" were
# describing the CI of the repositories that were folded, not this one. The
# lock, the session index, the leased pop and the tenant prefix are the product,
# and they were being checked by nobody on every push.
#
# ci.yml keeps what it owns: the root module, and the check that its go.mod
# carries nothing but golang.org/x/crypto. That check is also what proves no
# driver leaked into the core, so it is not repeated here.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # One job per module. A single job with two `cd`s hides which one broke.
    strategy:
      fail-fast: false
      matrix:
        module: [redis, queue/connectors/redis]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    # A real server, because everything these two modules claim is a claim about
    # the protocol: SET NX either is atomic or it is not, and ZRem either is the
    # claim exactly one worker wins or it is not. A fake that implements the
    # happy path proves none of it.
    #
    # One image and not four. RESP is one protocol and four products (RULE 11),
    # and what keeps that true is that nothing here reaches for a script or a
    # module -- which TestNothingUsesLuaOrModules checks in both modules, at the
    # source, without a server. Booting Dragonfly, Valkey and KeyDB besides
    # would re-run the same commands against the same protocol; the portability
    # is guarded where it can actually be broken.
    services:
      resp:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # One variable for one protocol. It used to be KV_ADDRESS in the queue
      # connector and REDIS_ADDRESS in the adapter, and with two names whichever
      # one the runner exported ran one suite and skipped the other -- printing
      # ok for both.
      REDIS_ADDRESS: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "$out"; exit 1; }

      # GOWORK=off on purpose, and it is the guard that was missing. These
      # submodules carried a `replace` pointing at the checkout, so the version
      # their go.mod declared was never the one anything built against -- not
      # here, and not on a developer's machine. Seven releases of drift went by
      # under that. The replace is gone; this keeps a go.work from putting it
      # back, and makes the job build what a consumer downloads.
      - name: vet
        run: GOWORK=off go vet ./...

      - name: test
        run: GOWORK=off go test -race ./...

      # A suite that skipped is a suite that printed ok, and this repository has
      # been burned by exactly that: the queue connector ran ten tests against
      # nothing for as long as it read a variable no runner set. `go test` has
      # no exit code for "everything skipped", so the run is counted.
      - name: the suite actually ran
        run: |
          out=$(go test -count=1 -v ./... 2>&1) || { echo "$out"; exit 1; }
          passed=$(grep -c '^[[:space:]]*--- PASS' <<<"$out" || true)
          skipped=$(grep -c '^[[:space:]]*--- SKIP' <<<"$out" || true)
          echo "$passed passed, $skipped skipped"
          if [ "$skipped" -gt 0 ]; then
            grep '^[[:space:]]*--- SKIP' <<<"$out"
            echo "a test skipped: the server was not reached"
            exit 1
          fi
          test "$passed" -gt 0 || { echo "no test ran"; exit 1; }
