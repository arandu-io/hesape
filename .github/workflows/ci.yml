name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The api diff step below reads the tags and checks the last release
          # out into a second worktree. The default checkout fetches one commit
          # and no tags at all, which does not fail that step -- it makes it
          # find no release, say so, and pass. A gate that reports nothing and
          # exits 0 is not a gate.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # `gofmt -l .` skips nothing, and a view source is not valid Go: it
      # carries a build tag the compiler honours and gofmt does not.
      # Two filters, and neither is taste. gofmt is the one tool in the chain
      # that ignores a build tag, so a .kyse.go file reaches it and fails on the
      # '@' its directives begin with. And testdata/ holds fixtures that are
      # invalid on purpose -- two of them here are programs the database tests
      # compile and expect to be refused.
      - name: gofmt
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path '*/testdata/*' -not -name '*.kyse.go'))
          test -z "$out" || { echo "$out"; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The exported surface, compared against the last release.
      #
      # It does not forbid breaking. While the version starts with v0. it is
      # allowed to, and freezing a shape nobody has built on is worse. What it
      # forbids is breaking QUIETLY: an incompatible change with no entry in
      # UPGRADE.md fails here, in a diff somebody is reviewing, instead of in
      # the build of one of the modules that require this one.
      #
      # The comparison is per MODULE and not package by package. A loop over
      # the packages of the working tree cannot see a package that was deleted:
      # it is not in `go list ./...` any more, so nothing ever asks about it.
      # Two of the breaks already shipped here are exactly that -- socialite
      # went in v0.3.0 and routing/events in v0.9.0 -- and both would pass a
      # per-package gate without a word. Module mode reports a removed package
      # as the removal it is.
      #
      # Only the root module, which is the one the other modules require. The
      # connectors under database/, filesystem/, queue/ and redis/ carry their
      # own go.mod and their own tags, and `git tag --list 'v*'` leaves those
      # tags alone because they are prefixed with the path.
      - name: api diff against the last release
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no release to compare against yet"
            exit 0
          fi
          echo "comparing the working tree against $latest"

          tmp=$(mktemp -d)
          old="$tmp/last-release"
          git worktree add -q --detach "$old" "$latest"
          # Reading the old surface has to happen in the old tree: apidiff
          # resolves an import path against the go.mod of the directory it runs
          # in, and from anywhere else it would read the module cache -- which
          # holds the published release, not the tag this checkout is at.
          (cd "$old" && go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" github.com/arandu-io/hesape)
          git worktree remove --force "$old"

          # Written to a file and read afterwards. Piped straight into grep, the
          # `|| true` that catches grep's no-match also catches apidiff's exit
          # code -- so a module that does not load reports nothing, `broke` is
          # empty, and the step says there was no incompatible change and passes.
          go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" github.com/arandu-io/hesape > "$tmp/diff.out"
          broke=$(grep '^- ' "$tmp/diff.out" || true)

          if [ -z "$broke" ]; then
            echo "no incompatible change since $latest"
            exit 0
          fi
          echo "$broke" | sed 's/^/    /'

          # Broken is allowed. Broken and unwritten is not.
          if git diff --quiet "$latest" -- UPGRADE.md; then
            echo
            echo "there are incompatible changes and UPGRADE.md was not touched since $latest."
            echo "Write what broke and what to write instead. That file is the whole mechanism."
            exit 1
          fi

          # And the entry has to be about THESE breaks.
          #
          # "Touched since the tag" was the whole test, and it stops testing
          # anything the moment the file has been touched once: a release writes
          # its entry, and every incompatible change after it rides in unwritten
          # until the next tag. That is not a hypothetical -- two packages were
          # removed hours after an entry was written, and this check would have
          # passed them.
          #
          # So the added text has to NAME something apidiff reported. The path in
          # `- ./auth/passwords: removed` is the unit, because it is what a person
          # writing the entry would type anyway. This cannot tell a good entry from
          # a bad one, and does not try: it tells an entry about this change from
          # an entry about the last one.
          # apidiff writes two shapes, and both have to be read:
          #   - ./database/model.Collection: changed from ... to ...
          #   - package github.com/arandu-io/hesape/auth/passwords: removed
          # The leading `- ` goes, then `./` or `package `, then everything from
          # the first colon. And the needle is passed after `--`, because a symbol
          # that still began with a dash was being read by grep as an option --
          # which printed a usage line and quietly matched nothing.
          added=$(git diff "$latest" -- UPGRADE.md | grep '^+' || true)
          named=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            symbol=${line#- }
            symbol=${symbol#package }
            symbol=${symbol#./}
            symbol=${symbol%%:*}
            [ -n "$symbol" ] || continue
            if printf '%s' "$added" | grep -qF -- "$symbol"; then named=1; break; fi
          done <<< "$broke"

          if [ "$named" -eq 0 ]; then
            echo
            echo "UPGRADE.md moved since $latest, and names none of the symbols above."
            echo "An entry written for an earlier change is not an entry for this one."
            exit 1
          fi
          echo
          echo "incompatible changes, and UPGRADE.md names them. Read the entry in review."

      # The same gate, for the six modules the step above deliberately leaves
      # alone. Each carries its own go.mod, its own tags and its own release, and
      # each is required by somebody: without this an incompatible change in
      # hesape/redis shipped unwritten, because the root comparison never looks
      # inside a nested module.
      #
      # Three things this gets wrong if it is written the obvious way, and all
      # three pass silently rather than failing:
      #
      #   - A submodule's tags carry its path -- redis/v0.7.0, never v0.7.0.
      #     Matching 'v*' here compares the module against the ROOT's release: a
      #     real tree, a real diff, and an answer about the wrong module.
      #   - UPGRADE.md is one file, at the root. `git diff -- UPGRADE.md` asked
      #     from inside redis/ is a question about redis/UPGRADE.md, which does
      #     not exist and never should, so the diff is empty and every break
      #     fails the build. The pathspec is anchored with :(top).
      #   - `go run ... | grep '^- ' || true` swallows the exit code of the whole
      #     pipeline. A module that does not even load would report nothing and
      #     pass. The tool writes to a file and the file is read afterwards.
      #
      # It runs under the checkout above, which is the one that fetches the tags.
      # A default checkout finds no release, says so, and exits 0.
      - name: api diff of each submodule against its own last release
        run: |
          set -euo pipefail
          failed=0
          for gomod in $(git ls-files '*/go.mod' | sort); do
            dir=${gomod%/go.mod}
            mod="github.com/arandu-io/hesape/$dir"

            latest=$(git tag --list "$dir/v*" --sort=-v:refname | head -1)
            if [ -z "$latest" ]; then
              echo "$mod: no release to compare against yet"
              continue
            fi
            echo "comparing $mod against $latest"

            tmp=$(mktemp -d)
            old="$tmp/last-release"
            git worktree add -q --detach "$old" "$latest"

            # Both halves run from inside the module's own directory: apidiff
            # resolves an import path against the go.mod of the directory it is
            # in, and from anywhere else it reads the module cache.
            if ! (cd "$old/$dir" && go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" "$mod"); then
              echo "$mod: could not read the surface of $latest"
              git worktree remove --force "$old"
              failed=1
              continue
            fi
            git worktree remove --force "$old"

            if ! (cd "$dir" && go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" "$mod" > "$tmp/diff.out" 2>&1); then
              echo "$mod: could not read the surface of the working tree"
              cat "$tmp/diff.out"
              failed=1
              continue
            fi

            broke=$(grep '^- ' "$tmp/diff.out" || true)
            if [ -z "$broke" ]; then
              echo "  no incompatible change since $latest"
              continue
            fi
            echo "$broke" | sed 's/^/    /'

            # Broken is allowed. Broken and unwritten is not.
            if git diff --quiet "$latest" -- ":(top)UPGRADE.md"; then
              echo
              echo "$mod has incompatible changes and UPGRADE.md was not touched since $latest."
              echo "Write what broke and what to write instead. That file is the whole mechanism."
              failed=1
              continue
            fi
            echo "  incompatible changes, and UPGRADE.md was updated. Read the entry in review."
          done

          # Every module is checked before the step fails, so one run reports all
          # of them rather than the first one.
          exit "$failed"

      # A known vulnerability blocks the merge rather than showing up in a
      # report nobody reads. Unpinned on purpose, unlike the linter: a new
      # govulncheck release going red means a new vulnerability was published,
      # which is the answer we want, and the database is read at run time so
      # pinning the binary would not hold it still anyway.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The collection carries no direct third-party dependency beyond
      # golang.org/x/crypto. A require line that is not that is a review.
      #
      # go.mod has two shapes -- a require block with indented lines, and one
      # require line per dependency -- and the check that stood here read only
      # the first. A dependency added in the second shape passed it, which was
      # proven by adding one and watching it pass. This reads both.
      #
      # Indirect dependencies are not counted. golang.org/x/sys is one, through
      # x/crypto, and a module graph recording what it always pulled is not a
      # dependency somebody added.
      - name: no third-party dependency
        run: |
          direct=$(grep -E '^(require[[:space:]]+|[[:space:]]+)[a-z0-9.-]+\.[a-z]+/' go.mod \
            | grep -v '// indirect' \
            | sed -E 's/^require[[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]].*//' \
            | grep -v '^golang\.org/x/crypto$' \
            | grep -v '^github\.com/arandu-io/' || true)
          if [ -n "$direct" ]; then
            echo "a direct dependency was added to the collection:"
            echo "$direct"
            exit 1
          fi
