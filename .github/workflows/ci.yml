name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The api diff step below reads the tags and checks the last release
          # out into a second worktree. The default checkout fetches one commit
          # and no tags at all, which does not fail that step -- it makes it
          # find no release, say so, and pass. A gate that reports nothing and
          # exits 0 is not a gate.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # `gofmt -l .` skips nothing, and a view source is not valid Go: it
      # carries a build tag the compiler honours and gofmt does not.
      # Two filters, and neither is taste. gofmt is the one tool in the chain
      # that ignores a build tag, so a .kyse.go file reaches it and fails on the
      # '@' its directives begin with. And testdata/ holds fixtures that are
      # invalid on purpose -- two of them here are programs the database tests
      # compile and expect to be refused.
      - name: gofmt
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path '*/testdata/*' -not -name '*.kyse.go'))
          test -z "$out" || { echo "$out"; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The exported surface, compared against the last release.
      #
      # It does not forbid breaking. While the version starts with v0. it is
      # allowed to, and freezing a shape nobody has built on is worse. What it
      # forbids is breaking QUIETLY: an incompatible change with no entry in
      # UPGRADE.md fails here, in a diff somebody is reviewing, instead of in
      # the build of one of the modules that require this one.
      #
      # The comparison is per MODULE and not package by package. A loop over
      # the packages of the working tree cannot see a package that was deleted:
      # it is not in `go list ./...` any more, so nothing ever asks about it.
      # Two of the breaks already shipped here are exactly that -- socialite
      # went in v0.3.0 and routing/events in v0.9.0 -- and both would pass a
      # per-package gate without a word. Module mode reports a removed package
      # as the removal it is.
      #
      # Only the root module, which is the one the other modules require. The
      # connectors under database/, filesystem/, queue/ and redis/ carry their
      # own go.mod and their own tags, and `git tag --list 'v*'` leaves those
      # tags alone because they are prefixed with the path.
      - name: api diff against the last release
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no release to compare against yet"
            exit 0
          fi
          echo "comparing the working tree against $latest"

          tmp=$(mktemp -d)
          old="$tmp/last-release"
          git worktree add -q --detach "$old" "$latest"
          # Reading the old surface has to happen in the old tree: apidiff
          # resolves an import path against the go.mod of the directory it runs
          # in, and from anywhere else it would read the module cache -- which
          # holds the published release, not the tag this checkout is at.
          (cd "$old" && go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" github.com/arandu-io/hesape)
          broke=$(go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" github.com/arandu-io/hesape | grep '^- ' || true)
          git worktree remove --force "$old"

          if [ -z "$broke" ]; then
            echo "no incompatible change since $latest"
            exit 0
          fi
          echo "$broke" | sed 's/^/    /'

          # Broken is allowed. Broken and unwritten is not.
          if git diff --quiet "$latest" -- UPGRADE.md; then
            echo
            echo "there are incompatible changes and UPGRADE.md was not touched since $latest."
            echo "Write what broke and what to write instead. That file is the whole mechanism."
            exit 1
          fi
          echo
          echo "incompatible changes, and UPGRADE.md was updated. Read the entry in review."

      # A known vulnerability blocks the merge rather than showing up in a
      # report nobody reads. Unpinned on purpose, unlike the linter: a new
      # govulncheck release going red means a new vulnerability was published,
      # which is the answer we want, and the database is read at run time so
      # pinning the binary would not hold it still anyway.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The collection carries no third-party dependency beyond
      # golang.org/x/crypto. A require line that is not that is a review.
      - name: no third-party dependency
        run: |
          if grep -E '^\s+[a-z]' go.mod | grep -v 'golang.org/x/crypto' | grep -q .; then
            echo "a dependency was added to the collection:"
            grep -E '^\s+[a-z]' go.mod
            exit 1
          fi
